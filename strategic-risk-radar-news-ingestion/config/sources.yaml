keywords:
  - armed conflict
  - border closure
  - visa restrictions
  - shipping disruption
  - displacement

sources:
  - id: gdelt
    type: gdelt
    enabled: true
    url: https://api.gdeltproject.org/api/v2/doc/doc
    max_records: 50
    minimum_request_interval_seconds: 5.2
    retry_attempts: 3

  - id: reliefweb
    type: reliefweb
    enabled: true
    url: https://api.reliefweb.int/v2/reports
    appname_env: RELIEFWEB_APPNAME
    max_records: 50
    retry_attempts: 3

  - id: un_news_middle_east
    type: rss
    enabled: true
    url: https://news.un.org/feed/subscribe/en/news/region/middle-east/feed/rss.xml
    retry_attempts: 3

  - id: gdacs_alerts
    type: rss
    enabled: true
    url: https://www.gdacs.org/xml/rss.xml
    retry_attempts: 3
