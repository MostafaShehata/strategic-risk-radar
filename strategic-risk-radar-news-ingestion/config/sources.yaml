keywords:
  - name: conflict escalation
    terms:
      - military escalation
      - conflict escalation
      - hostilities intensify
  - name: maritime and cargo disruption
    terms:
      - attack on commercial shipping
      - vessel seized
      - shipping lane closure
      - port closure
      - no safe transit
  - name: aviation and passenger disruption
    terms:
      - airspace closure
      - airport closure
      - flight suspension
      - mass flight cancellation
  - name: migration and residency pressure
    terms:
      - refugee influx
      - cross-border displacement
      - mass arrival
      - visa suspension
  - name: identity and border crime
    terms:
      - travel document fraud
      - fraudulent passport
      - migrant smuggling
      - human trafficking

sources:
  - id: gdelt
    type: gdelt
    enabled: true
    url: https://api.gdeltproject.org/api/v2/doc/doc
    max_records: 50
    minimum_request_interval_seconds: 5.2
    schedule_minutes: 30
    retry_attempts: 3

  - id: guardian
    type: guardian
    enabled: true
    url: https://content.guardianapis.com/search
    api_key_env: GUARDIAN_API_KEY
    api_key: test
    max_records: 50
    schedule_minutes: 30
    retry_attempts: 3

  - id: un_news_middle_east
    type: rss
    enabled: true
    url: https://news.un.org/feed/subscribe/en/news/region/middle-east/feed/rss.xml
    schedule_minutes: 30
    retry_attempts: 3

  - id: gdacs_alerts
    type: rss
    enabled: true
    url: https://www.gdacs.org/xml/rss.xml
    schedule_minutes: 30
    retry_attempts: 3
