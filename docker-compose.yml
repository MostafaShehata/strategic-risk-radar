services:
  model:
    container_name: strategic-risk-radar-model
    build: ./strategic-risk-radar-model
    image: strategic-risk-radar-model:local
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: deepseek-r1:1.5b
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:${MODEL_PORT:-11435}:11434"
    volumes:
      - risk-radar-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  db:
    container_name: strategic-risk-radar-db
    build: ./strategic-risk-radar-db
    image: strategic-risk-radar-db:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risk_radar}
      POSTGRES_USER: ${POSTGRES_USER:-risk_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_radar}
    ports:
      - "5434:5432"
    volumes:
      - risk-radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk_radar} -d ${POSTGRES_DB:-risk_radar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    image: strategic-risk-radar-db:local
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-risk_radar}
    command: ["psql", "-h", "db", "-U", "${POSTGRES_USER:-risk_radar}", "-d", "${POSTGRES_DB:-risk_radar}", "-f", "/docker-entrypoint-initdb.d/001-init.sql"]
    depends_on:
      db:
        condition: service_healthy

  news-ingestion:
    container_name: strategic-risk-radar-news-ingestion
    build: ./strategic-risk-radar-news-ingestion
    image: strategic-risk-radar-news-ingestion:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-risk_radar}:${POSTGRES_PASSWORD:-risk_radar}@db:5432/${POSTGRES_DB:-risk_radar}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-test}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-10}
      INGESTION_BACKFILL_DAYS: ${INGESTION_BACKFILL_DAYS:-7}
      INGESTION_REGULAR_WINDOW_MINUTES: ${INGESTION_REGULAR_WINDOW_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  data-studio-backend:
    container_name: strategic-risk-radar-data-studio-backend
    build: ./strategic-risk-radar-data-studio-backend
    image: strategic-risk-radar-data-studio-backend:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-risk_radar}:${POSTGRES_PASSWORD:-risk_radar}@db:5432/${POSTGRES_DB:-risk_radar}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  data-studio-frontend:
    container_name: strategic-risk-radar-data-studio-frontend
    build: ./strategic-risk-radar-data-studio-frontend
    image: strategic-risk-radar-data-studio-frontend:local
    ports:
      - "127.0.0.1:${DATA_STUDIO_PORT:-3000}:80"
    depends_on:
      - data-studio-backend

volumes:
  risk-radar-ollama:
  risk-radar-db:
