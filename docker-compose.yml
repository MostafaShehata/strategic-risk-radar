services:
  ollama-model:
    container_name: strategic-risk-radar-ollama-model
    build: ./strategic-risk-radar-ollama-model
    image: strategic-risk-radar-ollama-model:local
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: deepseek-r1:1.5b
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:${MODEL_PORT:-11435}:11434"
    volumes:
      - risk-radar-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  qdrant-vector-db:
    container_name: strategic-risk-radar-qdrant-vector-db
    build: ./strategic-risk-radar-qdrant-vector-db
    image: strategic-risk-radar-qdrant-vector-db:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6334}:6333"
    volumes:
      - risk-radar-qdrant:/qdrant/storage

  rag-api:
    container_name: strategic-risk-radar-rag-api
    build: ./strategic-risk-radar-rag-api
    image: strategic-risk-radar-rag-api:local
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant-vector-db:6333
      RAG_COLLECTION_NAME: strategic_risk_radar_docs
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      RAG_VECTOR_SIZE: "384"
      RAG_TOP_K: "5"
      CHUNK_MAX_WORDS: "180"
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8100}:8100"
    depends_on:
      - qdrant-vector-db

  firecrawler:
    container_name: strategic-risk-radar-firecrawler
    build: ./strategic-risk-radar-firecrawler
    image: strategic-risk-radar-firecrawler:local
    restart: unless-stopped
    environment:
      FIRECRAWLER_TIMEOUT_SECONDS: ${FIRECRAWLER_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:${FIRECRAWLER_PORT:-8300}:8300"

  news-enrichment:
    container_name: strategic-risk-radar-news-enrichment
    build: ./strategic-risk-radar-news-enrichment
    image: strategic-risk-radar-news-enrichment:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-risk_radar}:${POSTGRES_PASSWORD:-risk_radar}@postgres-db:5432/${POSTGRES_DB:-risk_radar}
      FIRECRAWLER_URL: http://firecrawler:8300
      FIRECRAWLER_TIMEOUT_SECONDS: ${FIRECRAWLER_TIMEOUT_SECONDS:-5}
      RAG_API_URL: http://rag-api:8100
      MODEL_BASE_URL: http://ollama-model:11434
      MODEL_NAME: deepseek-r1:1.5b
      ENRICHMENT_INTERVAL_SECONDS: ${ENRICHMENT_INTERVAL_SECONDS:-300}
      ENRICHMENT_BATCH_SIZE: ${ENRICHMENT_BATCH_SIZE:-1}
      ENABLE_LLM: ${ENABLE_LLM:-true}
      ENABLE_RAG_INDEXING: ${ENABLE_RAG_INDEXING:-true}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-15}
      MODEL_NUM_PREDICT: ${MODEL_NUM_PREDICT:-120}
      CLAIM_TIMEOUT_SECONDS: ${CLAIM_TIMEOUT_SECONDS:-1800}
      ENABLE_TOPIC_LLM: ${ENABLE_TOPIC_LLM:-true}
    depends_on:
      postgres-db:
        condition: service_healthy
      firecrawler:
        condition: service_started
      rag-api:
        condition: service_started
      ollama-model:
        condition: service_healthy

  postgres-db:
    container_name: strategic-risk-radar-postgres-db
    build: ./strategic-risk-radar-postgres-db
    image: strategic-risk-radar-postgres-db:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risk_radar}
      POSTGRES_USER: ${POSTGRES_USER:-risk_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_radar}
    ports:
      - "5434:5432"
    volumes:
      - risk-radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk_radar} -d ${POSTGRES_DB:-risk_radar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    image: strategic-risk-radar-postgres-db:local
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-risk_radar}
    command: ["psql", "-h", "postgres-db", "-U", "${POSTGRES_USER:-risk_radar}", "-d", "${POSTGRES_DB:-risk_radar}", "-f", "/docker-entrypoint-initdb.d/001-init.sql"]
    depends_on:
      postgres-db:
        condition: service_healthy

  news-ingestion:
    container_name: strategic-risk-radar-news-ingestion
    build: ./strategic-risk-radar-news-ingestion
    image: strategic-risk-radar-news-ingestion:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-risk_radar}:${POSTGRES_PASSWORD:-risk_radar}@postgres-db:5432/${POSTGRES_DB:-risk_radar}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-test}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-10}
      INGESTION_BACKFILL_DAYS: ${INGESTION_BACKFILL_DAYS:-7}
      INGESTION_REGULAR_WINDOW_MINUTES: ${INGESTION_REGULAR_WINDOW_MINUTES:-10}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  data-studio-backend:
    container_name: strategic-risk-radar-data-studio-backend
    build: ./strategic-risk-radar-data-studio-backend
    image: strategic-risk-radar-data-studio-backend:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-risk_radar}:${POSTGRES_PASSWORD:-risk_radar}@postgres-db:5432/${POSTGRES_DB:-risk_radar}
      RAG_API_URL: http://rag-api:8100
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      rag-api:
        condition: service_started

  data-studio-frontend:
    container_name: strategic-risk-radar-data-studio-frontend
    build: ./strategic-risk-radar-data-studio-frontend
    image: strategic-risk-radar-data-studio-frontend:local
    ports:
      - "127.0.0.1:${DATA_STUDIO_PORT:-3000}:80"
    depends_on:
      - data-studio-backend

volumes:
  risk-radar-ollama:
  risk-radar-qdrant:
  risk-radar-db:
