[project]
name = "strategic-risk-radar-ingestion"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ingest-news = "risk_radar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["risk_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

